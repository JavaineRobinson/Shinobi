[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shinobi-dfa"
version = "0.2.0"
description = "Shinobi: a DFA formal description language and compiler (UTech CIT4004, Sem 1 2026/27)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Lashawn Green (2305250)" },
    { name = "Kimberly Bruce (1909007)" },
    { name = "Javaine Robinson (2304749)" },
]
dependencies = [
    "flask>=3",      # web IDE (shinobi.app)
    "graphviz>=0.20",  # state diagrams (shinobi.render); also needs: brew install graphviz
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shinobi = "shinobi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shinobi = ["templates/*.html", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
